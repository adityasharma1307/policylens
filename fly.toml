app = 'policylens'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.dashboard'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '2gb'
  cpus = 1
  memory_mb = 2048
