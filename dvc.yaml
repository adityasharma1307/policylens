stages:
  ingest:
    cmd: python -m policylens.ingest.run
    deps:
      - src/policylens/ingest
      - src/policylens/validate/schemas.py
      - data/raw
    outs:
      - data/interim/raw_prices.parquet
      - data/interim/ingest_manifest.json

  clean:
    cmd: python -m policylens.transform.run
    deps:
      - src/policylens/transform
      - src/policylens/validate/schemas.py
      - data/interim/raw_prices.parquet
    outs:
      - data/interim/clean_prices_long.parquet
      - data/processed/prices_wide.parquet
      - data/interim/data_quality_report.json

  warehouse:
    cmd: python -m policylens.warehouse.run
    deps:
      - src/policylens/warehouse
      - data/processed/prices_wide.parquet
    outs:
      - data/processed/policylens.duckdb

  analysis:
    cmd: python -m policylens.analysis.run
    deps:
      - src/policylens/analysis
      - data/processed/prices_wide.parquet
      - data/interim/clean_prices_long.parquet
    outs:
      - reports/results.json:
          cache: false
      - reports/figures/margin_by_state.png:
          cache: false
      - reports/figures/margin_by_commodity.png:
          cache: false
      - reports/figures/retail_vs_wholesale.png:
          cache: false

  brief:
    cmd: python -m policylens.report.render_brief
    deps:
      - src/policylens/report
      - brief/policy_brief.md
      - reports/results.json
    outs:
      - brief/policy_brief.pdf:
          cache: false
      - brief/policy_brief.html:
          cache: false
